[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lower-limb-femur-study"
version = "0.1.0"
description = "Quantitative 3D Lower-Limb CT Analysis, Landmark Detection, and Orthopaedic Surgical Planning"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "CC-BY-4.0"}
authors = [
    {name = "Birat Gautam"}
]
dependencies = [
    "torch>=2.4.0",
    "monai>=1.4.0",
    "nnunetv2>=2.5.0",
    "totalsegmentator>=2.1.0",
    "SimpleITK>=2.4.0",
    "nibabel>=5.2.0",
    "pydicom>=2.4.0",
    "pyvista>=0.44.0",
    "vtk>=9.3.0",
    "scipy>=1.13.0",
    "scikit-image>=0.24.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
