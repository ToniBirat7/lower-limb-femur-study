[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lower-limb-femur-study"
version = "1.0.0"
description = "Femur segmentation, planning measurements, projection error and registration on HFValid CT"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Birat Gautam"}]
dependencies = [
    "SimpleITK>=2.4",
    "nibabel>=5.2",
    "pyvista>=0.44",
    "vtk>=9.3",
    "scipy>=1.13",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
models = [
    "torch>=2.4",
    "monai>=1.4",
    "nnunetv2>=2.5",
    "TotalSegmentator>=2.1",
]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
